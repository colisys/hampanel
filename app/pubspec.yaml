name: hampanel
description: "Hampanel 服务器面板桌面客户端"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  dartssh2: ^4.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  path_provider: ^2.1.5
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  sqlite3: ^3.9.1
  sqlite3_flutter_libs: ^0.6.0+eol
