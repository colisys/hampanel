name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, nightly]
  schedule:
    # Daily 18:30 UTC (02:30 CST). Schedule always runs the default
    # branch, so jobs check out `nightly` when triggered this way.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Build target (single target saves runner cost)"
        required: true
        default: all
        type: choice
        options:
          - all
          - daemon
          - daemon-gnu
          - daemon-musl
          - daemon-windows
          - flutter-linux
          - flutter-windows
          - flutter-macos
          - flutter-android
          - flutter-ios

permissions:
  contents: read

# Scheduled runs execute the default branch, so everything names itself
# after `nightly` and checks out that branch when triggered by cron.
env:
  BUILD_REF: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'all' }}-${{ (github.event_name == 'schedule' || github.ref == 'refs/heads/nightly') && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/nightly' }}

jobs:
  preflight:
    name: Check nightly publication
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule ]]; then
            if updated=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '.assets[] | select(.name == "version.txt" and .state == "uploaded") | .updated_at' 2>"$RUNNER_TEMP/nightly-release.err"); then
              if [[ -n "$updated" ]] && [[ "$(TZ=Asia/Shanghai date -d "$updated" +%F)" == "$(TZ=Asia/Shanghai date +%F)" ]]; then
                echo 'Nightly already published today (Asia/Shanghai).'
                echo 'build=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            elif ! grep -q '(HTTP 404)' "$RUNNER_TEMP/nightly-release.err"; then
              cat "$RUNNER_TEMP/nightly-release.err" >&2
              exit 1
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"

  daemon:
    name: Daemon (${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }})
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      needs.preflight.outputs.build == 'true' && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.target == 'all' ||
        github.event.inputs.target == 'daemon' ||
        github.event.inputs.target == 'daemon-gnu'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}

      - name: Compute commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig toolchain
        id: zig-sdk
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zig-0.17.1
          key: zig-0.17.1-linux-x86_64

      - name: Install Zig 0.17.1
        if: steps.zig-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "${{ runner.temp }}/zig-0.17.1"
          tar -xJf /tmp/zig.tar.xz -C "${{ runner.temp }}/zig-0.17.1" --strip-components=1

      - name: Save Zig toolchain
        if: steps.zig-sdk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/zig-0.17.1
          key: zig-0.17.1-linux-x86_64

      - name: Add Zig to PATH
        run: echo "${{ runner.temp }}/zig-0.17.1" >> "$GITHUB_PATH"

      - name: Restore Zig build cache
        uses: actions/cache@v4
        with:
          path: |
            daemon/.zig-cache
            ~/.cache/zig
          key: zig-build-linux-0.17.1-${{ hashFiles('daemon/build.zig', 'daemon/src/**/*.zig', 'daemon/src/**/*.h', 'daemon/vendor/sqlite/sqlite3.c') }}
          restore-keys: |
            zig-build-linux-0.17.1-

      - name: Install OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build daemon
        working-directory: daemon
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dcommit=${{ steps.commit.outputs.short }}

      - name: Test daemon
        working-directory: daemon
        run: zig build test

      - name: Type-check Windows backend
        working-directory: daemon
        run: zig build check-windows

      - name: Set up Go for risk gateway
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build risk gateway
        working-directory: daemon/src/platform/linux/risk_gateway
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/daemon/zig-out/bin/hampanel-risk" main.go

      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: hampaneld-linux-x86_64
          path: |
            daemon/zig-out/bin/hampaneld
            daemon/zig-out/bin/hampanel-risk
          if-no-files-found: error

  daemon-musl:
    name: Daemon musl (${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }})
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      needs.preflight.outputs.build == 'true' && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.target == 'all' ||
        github.event.inputs.target == 'daemon' ||
        github.event.inputs.target == 'daemon-musl'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}

      - name: Compute commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig toolchain
        id: zig-sdk
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zig-0.17.1
          key: zig-0.17.1-linux-x86_64

      - name: Install Zig 0.17.1
        if: steps.zig-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "${{ runner.temp }}/zig-0.17.1"
          tar -xJf /tmp/zig.tar.xz -C "${{ runner.temp }}/zig-0.17.1" --strip-components=1

      - name: Save Zig toolchain
        if: steps.zig-sdk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/zig-0.17.1
          key: zig-0.17.1-linux-x86_64

      - name: Restore Zig build cache
        uses: actions/cache@v4
        with:
          path: |
            daemon/.zig-cache
            ~/.cache/zig
          key: zig-build-linux-musl-0.17.1-${{ hashFiles('daemon/build.zig', 'daemon/src/**/*.zig', 'daemon/src/**/*.h', 'daemon/vendor/sqlite/sqlite3.c') }}
          restore-keys: |
            zig-build-linux-musl-0.17.1-

      - name: Build and test daemon (musl)
        working-directory: daemon
        env:
          COMMIT: ${{ steps.commit.outputs.short }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "${{ runner.temp }}/zig-0.17.1:/zig:ro" \
            -w /src/daemon \
            -e COMMIT \
            alpine:3.20 sh -c '
              apk add --no-cache build-base openssl-dev openssl-libs-static
              export PATH=/zig:$PATH
              zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dtarget=x86_64-linux-musl \
                -Dopenssl-static=true -Dopenssl-lib-dir=/usr/lib -Dcommit="$COMMIT"
              zig build test -Dtarget=x86_64-linux-musl \
                -Dopenssl-static=true -Dopenssl-lib-dir=/usr/lib -Dcommit="$COMMIT"
            '
          sudo chown -R "$(id -u):$(id -g)" zig-out .zig-cache

      - name: Set up Go for risk gateway
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build risk gateway
        working-directory: daemon/src/platform/linux/risk_gateway
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/daemon/zig-out/bin/hampanel-risk" main.go

      - name: Upload daemon (musl)
        uses: actions/upload-artifact@v4
        with:
          name: hampaneld-linux-musl-x86_64
          path: |
            daemon/zig-out/bin/hampaneld
            daemon/zig-out/bin/hampanel-risk
          if-no-files-found: error


  daemon-windows:
    name: Daemon Windows (${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }})
    runs-on: windows-latest
    needs: preflight
    if: >-
      needs.preflight.outputs.build == 'true' && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.target == 'all' ||
        github.event.inputs.target == 'daemon-windows'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}

      - name: Compute commit
        id: commit
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig toolchain
        id: zig-sdk
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.1-windows-x86_64

      - name: Install Zig 0.17.1
        if: steps.zig-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\zig"
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.17.1/zig-x86_64-windows-0.17.1.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath $dir -Force

      - name: Save Zig toolchain
        if: steps.zig-sdk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.1-windows-x86_64

      - name: Add Zig to PATH
        shell: pwsh
        run: |
          "$env:RUNNER_TEMP\zig\zig-x86_64-windows-0.17.1" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Restore Zig build cache
        uses: actions/cache@v4
        with:
          path: |
            daemon/.zig-cache
            ~/AppData/Local/zig
          key: zig-build-windows-0.17.1-${{ hashFiles('daemon/build.zig', 'daemon/src/**/*.zig', 'daemon/src/**/*.h', 'daemon/vendor/sqlite/sqlite3.c') }}
          restore-keys: |
            zig-build-windows-0.17.1-

      - name: Resolve vcpkg baseline
        id: vcpkg
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { Split-Path (Get-Command vcpkg).Source }
          "root=$root" >> $env:GITHUB_OUTPUT
          $prefix = "vcpkg-openssl-binary-v1-x64-windows-$env:ImageOS-"
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          $rev = if (Test-Path "$root\.git") { git -C $root rev-parse --short HEAD } else { 'bundled' }
          "key=$prefix$env:ImageVersion-$rev" >> $env:GITHUB_OUTPUT

      - name: Restore OpenSSL binary cache
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-openssl-binaries
          key: ${{ steps.vcpkg.outputs.key }}
          restore-keys: ${{ steps.vcpkg.outputs.prefix }}

      - name: Install OpenSSL
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-openssl-binaries,readwrite
          VCPKG_ROOT: ${{ steps.vcpkg.outputs.root }}
          VCPKG_CACHE_DIR: ${{ runner.temp }}/vcpkg-openssl-binaries
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_CACHE_DIR | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save OpenSSL binary cache
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-openssl-binaries
          key: ${{ steps.vcpkg.outputs.key }}

      - name: Build daemon
        working-directory: daemon
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { Split-Path (Get-Command vcpkg).Source }
          zig build -Doptimize=ReleaseSafe -Dcpu=baseline "-Dcommit=${{ steps.commit.outputs.short }}" `
            "-Dopenssl-dir=$vcpkgRoot\installed\x64-windows"

      - name: Stage package
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { Split-Path (Get-Command vcpkg).Source }
          $dst = "app/build/packaging/windows-daemon"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "daemon/zig-out/bin/hampaneld.exe" $dst -Force
          Copy-Item "$vcpkgRoot\installed\x64-windows\bin\*.dll" $dst -Force

      - name: Upload Windows daemon
        uses: actions/upload-artifact@v4
        with:
          name: hampaneld-windows-x86_64
          path: app/build/packaging/windows-daemon
          if-no-files-found: error

  flutter-linux:
    name: Flutter Linux (${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }})
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      needs.preflight.outputs.build == 'true' && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.target == 'all' ||
        github.event.inputs.target == 'flutter-linux'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}

      - name: Compute commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore AppImage tooling
        uses: actions/cache@v4
        with:
          path: app/build/packaging/cache
          key: appimage-tool-linux-x86_64-continuous-1

      - name: Install Flutter Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev imagemagick \
            fonts-noto-cjk fonts-dejavu-core

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Linux client
        working-directory: app
        run: >
          flutter build linux --release
          --dart-define=HAMPANEL_VERSION=0.1.0
          --dart-define=HAMPANEL_COMMIT=${{ steps.commit.outputs.short }}

      - name: Package AppImage
        run: bash tool/package/appimage.sh --version 0.1.0

      - name: Upload Linux client
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-client-linux-x86_64
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-appimage-linux-x86_64
          path: app/build/packaging/*.AppImage
          if-no-files-found: error

  flutter-windows:
    name: Flutter Windows (${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }})
    runs-on: windows-latest
    needs: preflight
    if: >-
      needs.preflight.outputs.build == 'true' && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.target == 'all' ||
        github.event.inputs.target == 'flutter-windows'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}

      - name: Compute commit
        id: commit
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore single-file packager tooling
        uses: actions/cache@v4
        with:
          path: app/build/packaging/cache
          key: windows-sfx-tool-lzma2501-1

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Windows client
        working-directory: app
        run: >
          flutter build windows --release
          --dart-define=HAMPANEL_VERSION=0.1.0
          --dart-define=HAMPANEL_COMMIT=${{ steps.commit.outputs.short }}

      - name: Ensure 7-Zip
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\7-Zip\7z.exe")) {
            choco install 7zip.install --no-progress -y
          }

      - name: Package single-file executable
        run: >
          dart tool/package/windows_portable.dart
          --bundle app/build/windows/x64/runner/Release
          --output app/build/packaging/hampanel-0.1.0-windows-x86_64.exe

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-client-windows-x86_64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error

      - name: Upload Windows portable executable
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-portable-windows-x86_64
          path: app/build/packaging/*.exe
          if-no-files-found: error

  flutter-macos:
    name: Flutter macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: preflight
    if: >-
      needs.preflight.outputs.build == 'true' && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.target == 'all' ||
        github.event.inputs.target == 'flutter-macos'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}

      - name: Compute commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build macOS client
        working-directory: app
        run: >
          flutter build macos --release
          --dart-define=HAMPANEL_VERSION=0.1.0
          --dart-define=HAMPANEL_COMMIT=${{ steps.commit.outputs.short }}

      - name: Package DMG
        run: |
          set -euo pipefail
          app_path="app/build/macos/Build/Products/Release/hampanel.app"
          codesign --force --deep --sign - "$app_path"
          mkdir -p app/build/packaging
          arch="$(uname -m)"
          hdiutil create -volname Hampanel -srcfolder "$app_path" -ov -format UDZO \
            "app/build/packaging/hampanel-client-macos-${arch}.dmg"

      - name: Upload macOS client
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-client-macos-${{ matrix.arch }}
          path: app/build/packaging/*.dmg
          if-no-files-found: error

  flutter-android:
    name: Flutter Android (${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }})
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      needs.preflight.outputs.build == 'true' && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.target == 'all' ||
        github.event.inputs.target == 'flutter-android'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}

      - name: Compute commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Stage release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK will be unsigned."
            exit 0
          fi
          path="$RUNNER_TEMP/hampanel-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$path"
          chmod 600 "$path"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build signed Android APK
        working-directory: app
        env:
          HAMPANEL_ANDROID_KEYSTORE: ${{ steps.keystore.outputs.path }}
          HAMPANEL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAMPANEL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HAMPANEL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --dart-define=HAMPANEL_VERSION=0.1.0
          --dart-define=HAMPANEL_COMMIT=${{ steps.commit.outputs.short }}

      - name: Verify APK signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/app/build/app/outputs/flutter-apk/app-release.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::warning::Android SDK path is unknown; skipping the signature check."
            exit 0
          fi
          apksigner=$(ls -d "$sdk_root"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - name: Collect APK
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p app/build/packaging
          suffix=""
          if [[ "$SIGNED" != "true" ]]; then suffix="-unsigned"; fi
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            "app/build/packaging/hampanel-0.1.0-android-universal${suffix}.apk"

      - name: Upload Android client
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-client-android
          path: app/build/packaging/*.apk
          if-no-files-found: error

  flutter-ios:
    name: Flutter iOS unsigned (${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }})
    runs-on: macos-latest
    needs: preflight
    if: >-
      needs.preflight.outputs.build == 'true' && (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.target == 'all' ||
        github.event.inputs.target == 'flutter-ios'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}

      - name: Compute commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Build unsigned iOS app
        working-directory: app
        run: >
          flutter build ios --release --no-codesign
          --dart-define=HAMPANEL_VERSION=0.1.0
          --dart-define=HAMPANEL_COMMIT=${{ steps.commit.outputs.short }}

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p app/build/packaging app/build/ios/iphoneos/Payload
          cp -R app/build/ios/iphoneos/Runner.app app/build/ios/iphoneos/Payload/
          (cd app/build/ios/iphoneos && \
            zip -qry ../../packaging/hampanel-0.1.0-ios-unsigned.ipa Payload)

      - name: Upload iOS client
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-client-ios-unsigned
          path: app/build/packaging/*.ipa
          if-no-files-found: error

  release:
    name: Publish release
    needs: [daemon, daemon-musl, daemon-windows, flutter-linux, flutter-windows, flutter-macos, flutter-android, flutter-ios]
    if: >-
      github.event_name != 'pull_request' &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'schedule' ||
        github.ref == 'refs/heads/nightly'
      ) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            title="Hampanel $GITHUB_REF_NAME"
            prerelease=false
          else
            tag="${BUILD_REF}"
            title="Hampanel ${BUILD_REF} (${short})"
            prerelease=true
          fi
          {
            echo "short=$short"
            echo "tag=$tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        env:
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          mkdir -p dist daemon-linux daemon-linux-musl daemon-windows

          cp artifacts/hampaneld-linux-x86_64/hampaneld daemon-linux/
          cp artifacts/hampaneld-linux-x86_64/hampanel-risk daemon-linux/
          cp deploy/bootstrap.sh deploy/install.sh LICENSE daemon-linux/
          chmod +x daemon-linux/hampaneld daemon-linux/hampanel-risk \
            daemon-linux/bootstrap.sh daemon-linux/install.sh
          tar -C daemon-linux -czf dist/hampanel-daemon-linux-x86_64.tar.gz .

          cp artifacts/hampaneld-linux-musl-x86_64/hampaneld daemon-linux-musl/
          cp artifacts/hampaneld-linux-musl-x86_64/hampanel-risk daemon-linux-musl/
          cp deploy/bootstrap.sh deploy/install.sh LICENSE daemon-linux-musl/
          chmod +x daemon-linux-musl/hampaneld daemon-linux-musl/hampanel-risk \
            daemon-linux-musl/bootstrap.sh daemon-linux-musl/install.sh
          tar -C daemon-linux-musl -czf dist/hampanel-daemon-linux-musl-x86_64.tar.gz .

          cp -r artifacts/hampaneld-windows-x86_64/. daemon-windows/
          cp deploy/windows/install.ps1 daemon-windows/
          cp LICENSE daemon-windows/LICENSE.txt
          (cd daemon-windows && zip -qr ../dist/hampanel-daemon-windows-x86_64.zip .)

          cp artifacts/hampanel-appimage-linux-x86_64/*.AppImage \
            dist/hampanel-client-linux-x86_64.AppImage
          cp artifacts/hampanel-portable-windows-x86_64/*.exe \
            dist/hampanel-client-windows-x86_64.exe
          cp artifacts/hampanel-client-macos-*/*.dmg dist/

          cp artifacts/hampanel-client-android/*.apk dist/
          cp artifacts/hampanel-client-ios-unsigned/*.ipa dist/

          cp deploy/install.sh dist/hampanel-install-linux.sh
          cp deploy/windows/install.ps1 dist/hampanel-install-windows.ps1
          chmod +x dist/hampanel-install-linux.sh
          echo "0.1.0+${SHORT}" > dist/version.txt
          cp LICENSE dist/LICENSE.txt

          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          notes=$(cat <<EOF
          Automated build from \`${BUILD_REF}\` at \`$(git rev-parse --short HEAD)\`.

          **Clients**
          - \`hampanel-client-linux-x86_64.AppImage\` — glibc Linux client (\`chmod +x\` then run)
          - \`hampanel-client-windows-x86_64.exe\` — single-file portable Windows client
          - \`hampanel-client-macos-*.dmg\` — macOS client (controls Linux and Windows daemons)
          - Android APK — signed with the Hampanel release key when the Android
            secrets are configured, otherwise published as \`…-unsigned.apk\`
          - \`hampanel-client-ios-unsigned.ipa\` — iOS client (unsigned; sign with your own provisioning profile)

          **Daemons**
          - \`hampanel-daemon-linux-x86_64.tar.gz\` — glibc build (hampaneld + risk gateway + installers)
          - \`hampanel-daemon-linux-musl-x86_64.tar.gz\` — static musl build (same contents)
          - \`hampanel-daemon-windows-x86_64.zip\` — hampaneld.exe + OpenSSL DLLs + installer

          **Installers**
          - \`hampanel-install-linux.sh\` / \`hampanel-install-windows.ps1\` — release binary (default) or source build

          Binary installs enable the built-in update check; source installs disable it.
          \`SHA256SUMS.txt\`, \`version.txt\` and \`LICENSE.txt\` are included.
          EOF
          )

          files=(dist/*)

          # Drop assets from a previous build of the same tag that are no longer
          # produced (for example the old unsigned APK).
          if gh release view "$TAG" >/dev/null 2>&1; then
            while IFS= read -r stale; do
              [[ -z "$stale" ]] && continue
              gh release delete-asset "$TAG" "$stale" --yes >/dev/null 2>&1 || true
            done < <(gh release view "$TAG" --json assets \
              --jq '.assets[].name' | grep -vxF -f <(printf '%s\n' "${files[@]##*/}"))
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$notes"
          else
            create_flags=()
            if [[ "$PRERELEASE" == "true" ]]; then
              create_flags+=(--prerelease --latest=false)
            else
              create_flags+=(--latest)
            fi
            if [[ "$GITHUB_REF" != refs/tags/* ]]; then
              create_flags+=(--target "${BUILD_REF}")
            fi
            gh release create "$TAG" "${files[@]}" \
              --title "$TITLE" --notes "$notes" "${create_flags[@]}"
          fi

          # Keep rolling release tags (e.g. nightly) pointing at the built commit
          if [[ "$PRERELEASE" == "true" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$(git rev-parse HEAD)" >/dev/null 2>&1 || true
          fi
