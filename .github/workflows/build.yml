name: Build

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.14.1
        run: |
          curl -fsSL https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Install OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build daemon
        working-directory: daemon
        run: zig build

      - name: Test daemon
        working-directory: daemon
        run: zig build test

      - name: Type-check Windows backend
        working-directory: daemon
        run: zig build check-windows

      - name: Set up Go for risk gateway
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build risk gateway
        working-directory: daemon/src/platform/linux/risk_gateway
        run: go build -o /tmp/hampanel-risk main.go

      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: hampaneld-${{ github.ref_name }}
          path: daemon/zig-out/bin/hampaneld
          if-no-files-found: error

  flutter-linux:
    name: Flutter Linux (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Linux client
        working-directory: app
        run: >
          flutter build linux --release
          --dart-define=HAMPANEL_VERSION=0.1.0
          --dart-define=HAMPANEL_COMMIT=${{ github.sha }}

      - name: Upload Linux client
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-linux-${{ github.ref_name }}
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error

  flutter-windows:
    name: Flutter Windows (${{ github.ref_name }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Windows client
        working-directory: app
        run: >
          flutter build windows --release
          --dart-define=HAMPANEL_VERSION=0.1.0
          --dart-define=HAMPANEL_COMMIT=${{ github.sha }}

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-windows-${{ github.ref_name }}
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error
