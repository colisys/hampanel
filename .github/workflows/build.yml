name: Build

on:
  push:
    branches: [main, nightly]
    tags: ["v*"]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Zig 0.14.1
        run: |
          curl -fsSL https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Install OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build daemon
        working-directory: daemon
        run: zig build -Doptimize=ReleaseSafe -Dcommit=${{ steps.commit.outputs.short }}

      - name: Test daemon
        working-directory: daemon
        run: zig build test

      - name: Type-check Windows backend
        working-directory: daemon
        run: zig build check-windows

      - name: Set up Go for risk gateway
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build risk gateway
        working-directory: daemon/src/platform/linux/risk_gateway
        run: go build -o "$GITHUB_WORKSPACE/daemon/zig-out/bin/hampanel-risk" main.go

      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: hampaneld-linux-x86_64
          path: |
            daemon/zig-out/bin/hampaneld
            daemon/zig-out/bin/hampanel-risk
          if-no-files-found: error

  flutter-linux:
    name: Flutter Linux (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Linux client
        working-directory: app
        run: >
          flutter build linux --release
          --dart-define=HAMPANEL_VERSION=0.1.0
          --dart-define=HAMPANEL_COMMIT=${{ steps.commit.outputs.short }}

      - name: Upload Linux client
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-client-linux-x86_64
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error

  flutter-windows:
    name: Flutter Windows (${{ github.ref_name }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute commit
        id: commit
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Windows client
        working-directory: app
        run: >
          flutter build windows --release
          --dart-define=HAMPANEL_VERSION=0.1.0
          --dart-define=HAMPANEL_COMMIT=${{ steps.commit.outputs.short }}

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: hampanel-client-windows-x86_64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error

  release:
    name: Publish release
    needs: [daemon, flutter-linux, flutter-windows]
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            title="Hampanel $GITHUB_REF_NAME"
            prerelease=false
          else
            tag="$GITHUB_REF_NAME"
            title="Hampanel $GITHUB_REF_NAME (${short})"
            prerelease=true
          fi
          {
            echo "short=$short"
            echo "tag=$tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "archive_base=hampanel-${tag#v}-${short}"
          } >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        env:
          BASE: ${{ steps.meta.outputs.archive_base }}
        run: |
          set -euo pipefail
          mkdir -p dist daemon-pkg client-linux

          cp artifacts/hampaneld-linux-x86_64/hampaneld daemon-pkg/
          cp artifacts/hampaneld-linux-x86_64/hampanel-risk daemon-pkg/
          cp deploy/bootstrap.sh LICENSE daemon-pkg/
          chmod +x daemon-pkg/hampaneld daemon-pkg/hampanel-risk daemon-pkg/bootstrap.sh
          tar -C daemon-pkg -czf "dist/${BASE}-daemon-linux-x86_64.tar.gz" .

          cp -r artifacts/hampanel-client-linux-x86_64/. client-linux/
          cp LICENSE client-linux/LICENSE
          tar -C client-linux -czf "dist/${BASE}-client-linux-x86_64.tar.gz" .

          cp -r artifacts/hampanel-client-windows-x86_64 client-windows
          cp LICENSE client-windows/LICENSE.txt
          (cd client-windows && zip -qr "../dist/${BASE}-client-windows-x86_64.zip" .)

          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          BASE: ${{ steps.meta.outputs.archive_base }}
        run: |
          set -euo pipefail

          notes=$(cat <<EOF
          Automated build from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`.

          - \`${BASE}-daemon-linux-x86_64.tar.gz\` — hampaneld + risk gateway + bootstrap.sh
          - \`${BASE}-client-linux-x86_64.tar.gz\` — Flutter Linux client
          - \`${BASE}-client-windows-x86_64.zip\` — Flutter Windows client
          - \`SHA256SUMS.txt\` — checksums
          EOF
          )

          files=(dist/*)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$notes"
          else
            create_flags=()
            if [[ "$PRERELEASE" == "true" ]]; then
              create_flags+=(--prerelease --latest=false)
            else
              create_flags+=(--latest)
            fi
            if [[ "$GITHUB_REF" != refs/tags/* ]]; then
              create_flags+=(--target "$GITHUB_REF_NAME")
            fi
            gh release create "$TAG" "${files[@]}" \
              --title "$TITLE" --notes "$notes" "${create_flags[@]}"
          fi
