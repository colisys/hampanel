services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:{{port}}:8188"
    volumes:
      - models:/app/models
      - user:/app/user
      - input:/app/input
      - output:/app/output
volumes:
  models:
  user:
  input:
  output:
