services:
  vllm:
    image: docker.io/vllm/vllm-openai:v0.34.0
    restart: unless-stopped
    command: ["--model", "Qwen/Qwen2.5-0.5B-Instruct", "--max-model-len", "4096"]
    environment:
      VLLM_API_KEY: "{{api_key}}"
    ports:
      - "{{port}}:8000"
    volumes:
      - models:/root/.cache/huggingface
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  models:
