services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{user}}"
      POSTGRES_PASSWORD: "{{password}}"
      POSTGRES_DB: "{{database}}"
    ports:
      - "{{port}}:5432"
    volumes:
      - data:/var/lib/postgresql/data

volumes:
  data:
