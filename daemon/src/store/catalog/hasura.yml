services:
  hasura:
    image: docker.io/hasura/graphql-engine:v2.48.4
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_DATABASE_URL: "postgres://hasura:{{db_password}}@postgres:5432/hasura"
      HASURA_GRAPHQL_ADMIN_SECRET: "{{admin_secret}}"
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
    ports:
      - "127.0.0.1:{{port}}:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: docker.io/library/postgres:16.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hasura
      POSTGRES_PASSWORD: "{{db_password}}"
      POSTGRES_DB: hasura
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "hasura", "-d", "hasura"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
